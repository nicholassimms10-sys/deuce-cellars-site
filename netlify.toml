# Deuce Cellars: static site, no build step.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Old Duda page addresses, so links and search results keep working after launch.
# Duda's sitemap listed /, /where-to-buy, /deuce-around-the-world and /private-tastings.
# / and /where-to-buy already resolve on Netlify (where-to-buy.html is served at /where-to-buy).
[[redirects]]
  from = "/deuce-around-the-world"
  to = "/world.html"
  status = 301

[[redirects]]
  from = "/private-tastings"
  to = "/visit.html"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
